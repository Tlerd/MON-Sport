name: pr-gates

# Two gates read the pull request description, so an edit of the description runs them again.
# The heavy checks stay in ci.yml and do not rerun on an edit.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: The changed paths are allowed
        run: node scripts/scope.mjs --base "$BASE"
      - name: Each listed AC has a test
        run: node scripts/ac-check.mjs --base "$BASE"
