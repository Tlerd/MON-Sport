name: deploy

# A push to main (a merged pull request) goes live on Cloud Run after the ci run of that commit passes.
# Google Cloud trusts this repository's main branch through Workload Identity Federation,
# so GitHub stores no key. docs/deploy-gcp.md shows the setup.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'Tlerd/MON-Sport' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Two merges close together can finish ci out of order. Only the newest main commit deploys.
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "$WANT" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "main moved to $head, skip $WANT"; fi
      - if: steps.latest.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - if: steps.latest.outputs.deploy == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - if: steps.latest.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@v3
      # The revision that serves now. A failed health check sends the traffic back to it.
      - id: previous
        if: steps.latest.outputs.deploy == 'true'
        run: echo "revision=$(gcloud run services describe monsport --region asia-southeast1 --format='value(status.traffic[0].revisionName)')" >> "$GITHUB_OUTPUT"
      - id: served
        if: steps.latest.outputs.deploy == 'true'
        run: |
          if [ -n "${{ steps.previous.outputs.revision }}" ]; then
            echo "commit=$(gcloud run revisions describe "${{ steps.previous.outputs.revision }}" --region asia-southeast1 --format='value(metadata.labels.commit)')" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.latest.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: needed
        if: steps.latest.outputs.deploy == 'true'
        env:
          SERVED: ${{ steps.served.outputs.commit }}
          WANT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -n "$SERVED" ] && git merge-base --is-ancestor "$SERVED" "$WANT"; then
            out=$(node scripts/ci-changes.mjs --range "$SERVED..$WANT")
            echo "$out"
            if echo "$out" | grep -q '^deploy=false$'; then
              echo "only files that do not change the image changed since $SERVED; skip deploy"
            fi
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      # The service keeps its Cloud SQL link, secrets, and memory from the first deploy.
      # Concurrency is set here, so a deploy never goes back to the default of 80 (docs/deploy-gcp.md).
      - id: deploy
        if: steps.latest.outputs.deploy == 'true' && steps.needed.outputs.deploy == 'true'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: monsport
          region: asia-southeast1
          source: .
          labels: commit=${{ github.event.workflow_run.head_sha || github.sha }}
          flags: --concurrency=60
      # A past rollback pins the traffic to one revision. Send it to the new revision before the check.
      - name: The new revision takes the traffic
        if: steps.latest.outputs.deploy == 'true' && steps.needed.outputs.deploy == 'true'
        run: gcloud run services update-traffic monsport --region asia-southeast1 --to-latest
      - name: The service answers
        if: steps.latest.outputs.deploy == 'true' && steps.needed.outputs.deploy == 'true'
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "${{ steps.deploy.outputs.url }}/api/health"
      # A revision that starts but fails its health check must not keep the traffic.
      # A migration that already ran stays: write each migration so the old revision still works with it.
      - name: Roll back to the previous revision
        if: failure() && steps.latest.outputs.deploy == 'true' && steps.needed.outputs.deploy == 'true' && steps.deploy.outcome == 'success' && steps.previous.outputs.revision != ''
        run: gcloud run services update-traffic monsport --region asia-southeast1 --to-revisions "${{ steps.previous.outputs.revision }}=100"
