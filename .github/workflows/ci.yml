name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older run, so a burst of pushes never queues stale runs.
# A run on main is never cancelled: deploy.yml reads its result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A skipped job counts as passed for scripts/merge.mjs (SKIPPED is in PASSED of scripts/ci-autofix.mjs).
  # A push to main always runs every job: deploy.yml compares with the serving revision, so main must be fully tested.
  # The jobs run on the self-hosted runner `monsport-local` (WSL2 Ubuntu with Docker and Chrome) to save GitHub minutes.
  # docs/design/ke-hoach-runner-tu-host.md says how to set it up and how to go back: change runs-on to ubuntu-latest.
  # The Postgres services use host port 55442: the runner machine runs its own Postgres on 5432.
  changes:
    runs-on: [self-hosted, monsport-local]
    outputs:
      check: ${{ steps.filter.outputs.check }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/ci-changes.mjs --base "origin/${{ github.base_ref }}"
          else
            echo "check=true" >> "$GITHUB_OUTPUT"
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi

  # Scans the new commits for secrets with gitleaks and .gitleaks.toml. It runs for every change, docs too, so no path filter.
  # A local `pnpm check` scans only the uncommitted changes, and only where gitleaks is installed. This job is the gate.
  secrets:
    runs-on: [self-hosted, monsport-local]
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      EVENT: ${{ github.event_name }}
      BASE_REF: ${{ github.base_ref }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install gitleaks (pinned version, checked against its SHA-256)
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --output "$dir/$file" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "$GITLEAKS_SHA256  $dir/$file" | sha256sum --check --quiet
          tar --extract --gzip --file "$dir/$file" --directory "$dir" gitleaks
          echo "GITLEAKS_BIN=$dir/gitleaks" >> "$GITHUB_ENV"
      - name: No secret in the new commits
        run: |
          if [ "$EVENT" = "pull_request" ]; then range="origin/$BASE_REF..HEAD"; else range="$BEFORE..$GITHUB_SHA"; fi
          node scripts/secret-scan.mjs --range "$range"

  check:
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: [self-hosted, monsport-local]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: monsport
          POSTGRES_PASSWORD: monsport
          POSTGRES_DB: monsport_test
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U monsport -d monsport_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://monsport:monsport@localhost:55442/monsport_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Builds the Cloud Run image and starts it against Postgres, because the dev machine has no Docker.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: [self-hosted, monsport-local]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: monsport
          POSTGRES_PASSWORD: monsport
          POSTGRES_DB: monsport_prod
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U monsport -d monsport_prod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag monsport .
      # A self-hosted runner keeps the container and port 8080 when a run is cancelled.
      - run: docker rm --force monsport-ci-app || true
      - name: Start the image
        run: >-
          docker run --detach --name monsport-ci-app --network host
          --env DATABASE_URL=postgresql://monsport:monsport@localhost:55442/monsport_prod
          --env SESSION_SECRET=ci-only-secret-0123456789abcdefghijklmnop
          monsport
      - name: The API and the web app answer
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent localhost:8080/api/health && curl --fail --silent localhost:8080/ | grep --quiet 'id="root"' && curl --fail --silent localhost:8080/app/ | grep --quiet '/app/manifest.webmanifest'; then exit 0; fi
            sleep 2
          done
          docker logs monsport-ci-app
          exit 1
      # The booking flows run in a real browser against the production image, before any merge can deploy it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Seed the image database
        run: pnpm --filter @monsport/api db:seed
        env:
          DATABASE_URL: postgresql://monsport:monsport@localhost:55442/monsport_prod
      - name: The booking flows pass in a browser
        run: node .agents/skills/verify-flow/scripts/run.mjs --base-url http://localhost:8080
        env:
          VERIFY_BROWSER: chrome
      - name: The mobile flow passes in a browser
        run: node .agents/skills/verify-flow/scripts/run.mjs --app mobile --base-url http://localhost:8080
        env:
          VERIFY_BROWSER: chrome
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-flow
          path: verify-output/
          if-no-files-found: ignore
      # The runner keeps its images between runs, so remove the container and the dangling images of old builds.
      - name: Remove the container and old images
        if: always()
        run: |
          docker rm --force monsport-ci-app || true
          docker image prune --force --filter "dangling=true" || true
