services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monsport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monsport}
      POSTGRES_DB: ${POSTGRES_DB:-monsport}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - monsport_pgdata:/var/lib/postgresql/data

volumes:
  monsport_pgdata:
